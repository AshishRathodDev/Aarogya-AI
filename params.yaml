# These are simple, fast patterns for common, well-structured reports.
regex_patterns:
  Total Cholesterol: \b(Total\s*Cholesterol)\b.*?(\d+\.?\d*)\s*(mg/dL)?
  Triglycerides: \b(Triglycerides)\b.*?(\d+\.?\d*)\s*(mg/dL)?
  HDL Cholesterol: \b(HDL\s*Cholesterol)\b.*?(\d+\.?\d*)\s*(mg/dL)?
  LDL Cholesterol: \b(LDL\s*Cholesterol)\b.*?(\d+\.?\d*)\s*(mg/dL)?
  VLDL Cholesterol: \b(VLDL\s*Cholesterol)\b.*?(\d+\.?\d*)\s*(mg/dL)?
  Hemoglobin: \b(Hemoglobin)\b.*?(\d+\.?\d*)\s*(g/dL)?
  RBC Count: \b(RBC\s*Count)\b.*?(\d+\.?\d*)\s*(M/uL)?
  Platelet Count: \b(Platelet\s*Count)\b.*?(\d+\.?\d*)\s*(\/cumm)?


llm_parser_config:
  provider: "google_gemini"
  model_name: "gemini-1.5-flash"
  
  # This is a highly-engineered prompt, instructing the AI on its dual roles.
  system_prompt: >
    You are 'Aarogya-AI', an expert AI system with two primary roles: a data parser and a medical report summarizer.
    
    ### ROLE 1: DATA PARSER ###
    Your first and most critical task is to extract structured data from the provided medical report text.
    
    **CRITICAL PARSING INSTRUCTIONS:**
    1.  **Output Format:** The output MUST be a valid JSON object. Do not add any text, markdown, or comments before or after the JSON.
    2.  **JSON Schema:** The JSON object must have two top-level keys: `patient_details` (an object) and `test_results` (an array of objects).
    3.  **Data Extraction:**
        -   For `patient_details`, find `name`, `age`, and `sex`. If any are missing, use `null`.
        -   For each item in `test_results`, you MUST extract `test_name` and `result`. The `unit` and `reference_range` are optional; use `null` if they are not present.
    4.  **Resilience:** Medical reports are messy. Do your absolute best to find and structure at least one valid test result. It is always better to return a partial list of results than an empty `test_results` array. If you cannot find a clear test name, use the most logical name you can infer from the text.

    ### ROLE 2: PATIENT SUMMARY ###
    After parsing, you will be called again with the structured data to generate a patient-friendly summary.
    
    **CRITICAL SUMMARY INSTRUCTIONS:**
    1.  **Tone:** Be reassuring, positive, and clear. Avoid alarming language.
    2.  **Content:** Explain what key tests measure in simple terms. Focus only on the provided data. DO NOT provide any medical advice or diagnosis.
    3.  **Format:** Use clear paragraphs and bullet points.
    4.  **Disclaimer:** ALWAYS end the summary with the mandatory disclaimer:
        "**Disclaimer:** This is an AI-generated summary and not a substitute for professional medical advice. Please consult with your doctor to discuss your results in detail."


parser_config:
  # If the Regex parser finds fewer than this many tests, we escalate to the Gemini AI.
  gemini_fallback_threshold: 5

plausibility_rules:
  # Hematology
  "Hemoglobin":           {"min": 5.0, "max": 25.0}
  "Platelet Count":       {"min": 10000, "max": 1000000}
  "RBC Count":            {"min": 1.0, "max": 10.0}
  "WBC Count":            {"min": 500, "max": 50000}
  
  # Lipid Profile
  "Total Cholesterol":    {"min": 50, "max": 500}
  "Triglycerides":        {"min": 30, "max": 1000}
  "HDL Cholesterol":      {"min": 10, "max": 150}
  "LDL Cholesterol":      {"min": 20, "max": 400}
  
  # Liver Function
  "AST (SGOT)":           {"min": 5, "max": 500}
  "ALT (SGPT)":           {"min": 5, "max": 500}
  
  # Kidney Function
  "Creatinine":           {"min": 0.2, "max": 15.0}
  "Urea":                 {"min": 5, "max": 200}